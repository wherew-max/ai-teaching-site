<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>教師後台 · 鏡像城市錯題紀錄</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0a1026;color:#eaf2ff;font-family:"Segoe UI","Noto Sans TC","PingFang TC",sans-serif;min-height:100vh}
.wrap{max-width:960px;margin:0 auto;padding:22px 16px 60px}
h1{color:#facc15;margin:6px 0}
.sub{opacity:.75;font-size:13px;margin-bottom:14px}
.card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:18px;margin-top:14px}
.gate{max-width:360px;margin:12vh auto;text-align:center}
input,select{padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;font-size:15px}
input::placeholder{color:rgba(255,255,255,.45)}
select option{color:#111}
.btn{padding:10px 18px;border:none;border-radius:10px;background:linear-gradient(135deg,#6ee7ff,#7c5cff);color:#041022;font-weight:700;cursor:pointer;font-size:15px}
.btn.ghost{background:rgba(255,255,255,.08);color:#eaf2ff;border:1px solid rgba(255,255,255,.2)}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.filters label{font-size:12px;opacity:.8;display:block;margin-bottom:4px}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:12px}
th,td{padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.1);text-align:left}
th{color:#6ee7ff;white-space:nowrap}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.stat{background:rgba(250,204,21,.12);border:1px solid rgba(250,204,21,.4);border-radius:12px;padding:8px 14px;font-size:14px}
.stat b{color:#facc15}
.err{color:#f87171;min-height:20px;font-size:13px}
.links{margin-top:14px;display:flex;gap:10px;flex-wrap:wrap}
a{text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="card gate" id="gate">
    <h1>👩‍🏫 教師後台</h1>
    <div class="sub">鏡像城市 · 學生錯題紀錄<br>請輸入教師密碼</div>
    <input id="pw" type="password" placeholder="請輸入密碼" maxlength="12" style="width:200px;text-align:center" autocomplete="off">
    <div style="margin-top:10px"><button class="btn" id="go" style="width:200px">進入後台</button></div>
    <div class="err" id="gateMsg"></div>
    <div class="links" style="justify-content:center"><a href="index.html"><button class="btn ghost">← 回遊戲</button></a></div>
  </div>

  <div id="board" style="display:none">
    <h1>📋 錯題紀錄</h1>
    <div class="sub">鏡像城市 · 每次答錯自動記錄，可依班級／姓名／日期篩選</div>
    <div class="card">
      <div class="filters">
        <div><label>班級</label><select id="fClass"><option value="">全部班級</option></select></div>
        <div><label>姓名關鍵字</label><input id="fName" placeholder="例如：小麥" style="width:130px"></div>
        <div><label>日期</label><input id="fDate" type="date"></div>
        <div><button class="btn" id="searchBtn">🔍 篩選</button>
        <button class="btn ghost" id="clearBtn">清除</button></div>
      </div>
      <div class="stats" id="stats"></div>
      <div style="overflow:auto">
      <table>
        <thead><tr><th>時間</th><th>班級</th><th>姓名</th><th>座號</th><th>關卡</th><th>軸線</th><th>準確率</th></tr></thead>
        <tbody id="rows"><tr><td colspan="7">載入中…</td></tr></tbody>
      </table>
      </div>
    </div>
    <div class="links">
      <a href="index.html"><button class="btn ghost">← 回遊戲</button></a>
      <a href="../../index.html"><button class="btn ghost">🏠 回教學天地首頁</button></a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SB_URL='https://arjomhkzyugiuuzqtezs.supabase.co';
const SB_KEY='sb_publishable_fOv8SaMnTPNtDPFYhRm7dw_Yq9QYBIs';
const sb = window.supabase.createClient(SB_URL, SB_KEY);
const AXIS={vertical:'垂直線',horizontal:'水平線',diag:'斜對角',antidiag:'反斜對角'};
function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtTime(iso){ const d=new Date(iso); return d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }

function unlock(){
  if(document.getElementById('pw').value==='8888'){
    document.getElementById('gate').style.display='none';
    document.getElementById('board').style.display='block';
    loadClasses(); search();
  } else { document.getElementById('gateMsg').textContent='❌ 密碼錯誤'; }
}
document.getElementById('go').addEventListener('click', unlock);
document.getElementById('pw').addEventListener('keydown', e=>{ if(e.key==='Enter') unlock(); });

async function loadClasses(){
  const {data}=await sb.from('mistakes').select('class_name').neq('class_name','').limit(500);
  const set=[...new Set((data||[]).map(r=>r.class_name))].sort();
  const sel=document.getElementById('fClass');
  sel.innerHTML='<option value="">全部班級</option>'+set.map(c=>'<option value="'+esc(c)+'">'+esc(c)+'</option>').join('');
}

async function search(){
  const cls=document.getElementById('fClass').value;
  const name=document.getElementById('fName').value.trim();
  const date=document.getElementById('fDate').value;
  const tb=document.getElementById('rows');
  tb.innerHTML='<tr><td colspan="7">載入中…</td></tr>';
  try{
    let q=sb.from('mistakes').select('*').order('created_at',{ascending:false}).limit(200);
    if(cls) q=q.eq('class_name',cls);
    if(name) q=q.ilike('player_name','%'+name+'%');
    if(date){ q=q.gte('created_at',date+'T00:00:00').lt('created_at',date+'T23:59:59.999'); }
    const {data,error}=await q;
    if(error) throw error;
    if(!data.length){ tb.innerHTML='<tr><td colspan="7">沒有符合的紀錄 🎉（可能全對，太厲害了！）</td></tr>'; }
    else{
      tb.innerHTML=data.map(r=>'<tr><td>'+fmtTime(r.created_at)+'</td><td>'+esc(r.class_name||'-')+'</td><td>'+esc(r.player_name)+'</td><td>'+esc(r.seat_no||'-')+'</td><td>'+r.level+'</td><td>'+(AXIS[r.axis]||esc(r.axis))+'</td><td>'+r.accuracy+'%</td></tr>').join('');
    }
    const n=data.length;
    const avg=n?Math.round(data.reduce((s,r)=>s+Number(r.accuracy),0)/n):0;
    const byAxis={};
    data.forEach(r=>{ const k=AXIS[r.axis]||r.axis||'?'; byAxis[k]=(byAxis[k]||0)+1; });
    document.getElementById('stats').innerHTML='<span class="stat">共 <b>'+n+'</b> 筆錯題</span><span class="stat">平均準確率 <b>'+avg+'%</b></span>'+Object.entries(byAxis).map(([k,v])=>'<span class="stat">'+esc(k)+' <b>'+v+'</b> 筆</span>').join('');
  }catch(e){ tb.innerHTML='<tr><td colspan="7">載入失敗，請檢查網路後重試</td></tr>'; }
}
document.getElementById('searchBtn').addEventListener('click', search);
document.getElementById('clearBtn').addEventListener('click', ()=>{
  document.getElementById('fClass').value='';
  document.getElementById('fName').value='';
  document.getElementById('fDate').value='';
  search();
});
</script>
</body>
</html>
