<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>班級經營小工具 · 歐小麥老師的 AI 教學天地</title>
<style>
:root{
  --cream:#FFF7E6; --pink:#FF8FB1; --pink-deep:#F8578A;
  --yellow:#FFC93C; --mint:#5ED6B5; --sky:#5EB1FF; --purple:#A78BFA;
  --ink:#4A3F55; --card:#ffffff; --done:#34d399;
}
*{box-sizing:border-box}
body{
  margin:0; color:var(--ink);
  font-family:"Zen Maru Gothic","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  background:
    radial-gradient(circle at 15% 10%, #FFE3EE 0 120px, transparent 121px),
    radial-gradient(circle at 85% 15%, #FFF3C4 0 140px, transparent 141px),
    radial-gradient(circle at 90% 85%, #D6F5E7 0 160px, transparent 161px),
    radial-gradient(circle at 8% 80%, #E3EFFF 0 150px, transparent 151px),
    var(--cream);
  min-height:100vh;
}
.clouds{font-size:28px; letter-spacing:12px; text-align:center; margin:14px 0 0; animation:float 4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.wrap{max-width:1100px; margin:0 auto; padding:0 16px 60px}
header.hero{
  background:linear-gradient(135deg,#fff 0%,#FFF0F5 60%,#FFF8DC 100%);
  border:4px solid #fff; outline:3px dashed #FFD1E0; outline-offset:6px;
  border-radius:32px; padding:26px 24px; text-align:center; margin-top:10px;
  box-shadow:0 12px 30px rgba(248,87,138,.18);
}
.mascots{font-size:44px; line-height:1}
h1{margin:10px 0 6px; font-size:clamp(24px,5vw,36px); color:var(--pink-deep); letter-spacing:1px}
h1 small{display:block; font-size:14px; color:#8a7a99; letter-spacing:4px; margin-top:6px}
.subtitle{font-size:15px; background:#fff; display:inline-block; padding:8px 16px; border-radius:999px; border:2px solid #FFE0EB}
.btn-back{display:inline-flex; align-items:center; gap:8px; margin-top:12px; text-decoration:none; color:var(--ink); font-weight:800; font-size:15px; background:#fff; border:2px solid #FFE0EB; border-radius:999px; padding:8px 14px}
.btn-back:hover{background:#FFF0F5}
.grid{display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-top:18px}
@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.grid{grid-template-columns:1fr}}
.tool{background:var(--card); border-radius:26px; padding:16px; border:3px solid #fff; box-shadow:0 10px 24px rgba(0,0,0,.08)}
.tool h2{margin:6px 0 2px; font-size:18px; color:var(--pink-deep)}
.title-row{display:flex; gap:8px; align-items:center; margin-bottom:12px}
.title-row input{flex:1; padding:8px 10px; border-radius:10px; border:2px solid #FFE0EB; background:#FFF7E6; color:var(--ink); font-weight:800; font-size:15px}
.title-row input::placeholder{color:#bda8c8}
.count-row{margin-bottom:10px}
.count-row label{font-size:13px; opacity:.85; margin-right:8px}
.count-row input{width:56px; padding:7px; border-radius:10px; border:2px solid #FFE0EB; background:#FFF7E6; color:var(--ink); font-weight:800; font-size:14px; text-align:center}
.seats{display:flex; flex-wrap:wrap; gap:6px}
.seat{
  width:44px; height:44px; border-radius:12px; border:2px solid #eee;
  background:#fff; color:#999; font-weight:800; font-size:13px; cursor:pointer; display:flex; align-items:center; justify-content:center; user-select:none
}
.seat:hover{border-color:#FFC93C}
.seat.done{background:var(--done); color:#fff; border-color:var(--done)}
.seat.done::after{ content:"完成"; }
.stats{margin-top:10px; font-size:13px; color:#6b5f7a; display:flex; gap:10px; flex-wrap:wrap}
.reset{margin-top:10px; border:none; cursor:pointer; font-family:inherit; font-weight:800; padding:8px 14px; border-radius:10px; background:#eee; color:#6b5f7a; font-size:13px}
.reset:hover{background:#ddd}
footer{text-align:center; margin-top:22px; font-size:13px; color:#8a7a99}
.save-note{font-size:12px; opacity:.7; margin-top:6px; color:#8a7a99}
.praise{
  position:absolute;
  top:-8px; left:50%;
  transform:translateX(-50%);
  font-size:19px; font-weight:900;
  color:#ff578a; background:rgba(255,247,230,.96);
  border:2px solid #ffc93c; border-radius:14px;
  padding:6px 14px; z-index:10; white-space:nowrap;
  box-shadow:0 8px 20px rgba(248,87,138,.25);
  animation:praise-fly 1.4s ease-out forwards;
}
@keyframes praise-fly{
  0%{transform:translateX(-50%) translateY(0) scale(.6); opacity:0;}
  20%{transform:translateX(-50%) translateY(-16px) scale(1.15); opacity:1;}
  100%{transform:translateX(-50%) translateY(-38px) scale(1); opacity:0;}
}
</style>
</head>
<body>
<div class="clouds">☁️ 🌈 ☁️ ⭐ ☁️ 🎈 ☁️</div>
<div class="wrap">
  <header class="hero">
    <div class="mascots">🦊 🍞 🤖 📚 ✨</div>
    <h1>班級經營小工具<small>CLASS MANAGEMENT TOOLS</small></h1>
    <div class="subtitle">三個工具並排，標題與座號皆可自訂，點擊座號標示完成</div>
    <a href="../../index.html" class="btn-back">← 回教學天地首頁</a>
  </header>

  <div class="grid" id="grid"></div>

  <footer>© 歐小麥老師的 AI 教學天地 · 用愛與 AI 做的課堂小遊戲 🍞✨</footer>
</div>

<script>
const TOOLS = [
  {id:'tool0', title:'國習訂正', count:32},
  {id:'tool1', title:'數學訂正', count:32},
  {id:'tool2', title:'英文訂正', count:32},
];

function load(id){
  try{
    const raw = localStorage.getItem(id);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function save(id, data){
  try{ localStorage.setItem(id, JSON.stringify(data)); }catch(e){}
}

function renderTool(cfg){
  const d = document.createElement('div');
  d.className='tool';
  d.id = cfg.id;

  const stored = load(cfg.id);
  const title = stored && stored.title ? stored.title : cfg.title;
  const count = stored && typeof stored.count === 'number' ? stored.count : cfg.count;
  const seats = stored && Array.isArray(stored.seats) ? stored.seats : new Array(count).fill(false);

  const elTitle = document.createElement('input');
  elTitle.type='text'; elTitle.value=title; elTitle.placeholder='工具標題';
  elTitle.addEventListener('input', ()=>{ save(cfg.id, {title:elTitle.value, count:elCount.value, seats}); });

  const elCount = document.createElement('input');
  elCount.type='number'; elCount.min='1'; elCount.max='60'; elCount.value=count;
  elCount.addEventListener('change', ()=>{
    let nc = parseInt(elCount.value)||1; if(nc>60) nc=60;
    if(nc < seats.length){ seats.length = nc; }
    else { while(seats.length < nc) seats.push(false); }
    elCount.value = nc;
    buildSeats();
    save(cfg.id, {title:elTitle.value, count:nc, seats});
  });

  const seatsBox = document.createElement('div');
  seatsBox.className='seats';
  function buildSeats(){
    seatsBox.innerHTML='';
    seats.forEach((done, idx)=>{
      const b = document.createElement('button');
      b.type='button';
      b.className='seat'+(done?' done':'');
      b.textContent = idx+1;
      b.addEventListener('click', ()=>{
        seats[idx] = !seats[idx];
        const n = seats.filter(Boolean).length;
        if(seats[idx] && n>=1 && n<=10){
          showPraise(d, n);
        }
        b.className = seats[idx] ? 'seat done' : 'seat';
        b.textContent = seats[idx] ? '完成' : (idx+1);
        save(cfg.id, {title:elTitle.value, count:elCount.value, seats});
        updateStats();
      });
      seatsBox.appendChild(b);
    });
    updateStats();
  }
  function updateStats(){
    const n = seats.filter(Boolean).length;
    const elStats = d.querySelector('.stats') || (()=>{ const s=document.createElement('div'); s.className='stats'; seatsBox.parentNode.insertBefore(s, seatsBox.nextSibling); return s; })();
    elStats.innerHTML = `已完成 <span style="color:var(--done);font-weight:900">${n}</span> / ${seats.length} 個座號`;
  }
  function showPraise(root, n){
    const p = document.createElement('div');
    p.className='praise';
    p.textContent = '動作神速，真優秀！';
    root.style.position='relative';
    root.appendChild(p);
    setTimeout(()=> p.remove(), 1400);
  }

  const reset = document.createElement('button');
  reset.type='button'; reset.className='reset';
  reset.textContent='重置所有座號';
  reset.addEventListener('click', ()=>{
    if(!confirm('確定要重置此工具的所有座號嗎？')) return;
    seats.fill(false);
    buildSeats();
    save(cfg.id, {title:elTitle.value, count:elCount.value, seats});
  });

  const titleRow = document.createElement('div'); titleRow.className='title-row';
  titleRow.appendChild(elTitle);
  const countRow = document.createElement('div'); countRow.className='count-row';
  countRow.appendChild(document.createTextNode('座號數量：'));
  countRow.appendChild(elCount);

  d.appendChild(titleRow);
  d.appendChild(countRow);
  d.appendChild(seatsBox);
  d.appendChild(document.createElement('div')).className='stats';
  d.appendChild(reset);
  const note = document.createElement('div'); note.className='save-note'; note.textContent='資料自動儲存，關頁再開也不會消失';
  d.appendChild(note);

  buildSeats();
  return d;
}

(function init(){
  const grid = document.getElementById('grid');
  TOOLS.forEach(cfg => grid.appendChild(renderTool(cfg)));
})();
</script>
</body>
</html>
